# docker compose up -d --build   -> whole stack: http://localhost
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atsystem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atsystem}
      POSTGRES_DB: atsystem
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atsystem"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://atsystem:${POSTGRES_PASSWORD:-atsystem}@db:5432/atsystem?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env (32+ chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      CORS_ORIGIN: ${APP_URL:-http://localhost}
      APP_URL: ${APP_URL:-http://localhost}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80"]

volumes:
  pgdata: