# docker compose up -d db            -> only PostgreSQL (for local development, see README)
# docker compose up -d --build       -> whole stack: http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atsystem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atsystem}
      POSTGRES_DB: atsystem
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atsystem"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://atsystem:${POSTGRES_PASSWORD:-atsystem}@db:5432/atsystem?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env (32+ chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      CORS_ORIGIN: http://localhost:8080
      APP_URL: http://localhost:8080
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports: ["4000:4000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
